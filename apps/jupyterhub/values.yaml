# Zero to JupyterHub 4.4.5 (JupyterHub 5.5.5): per-user JupyterLab pods, sign-in through Keycloak.
#
#   Browser → http://jupyter.localhost (edge → Istio gateway → proxy-public)
#   Login   → Keycloak realm zt, client "jupyterhub" (auth code + PKCE). Its access token has
#             aud=jupyter-session: only the hub's own workload client can exchange it.
#   Tokens  → demo 04 chain. The login tokens stay in the hub's encrypted auth_state; user servers
#             can't read auth_state. The hub (SA jupyter-session, JWT-SVID) exchanges the login
#             token for a session token (scope session:token_exchange) and serves only that, at
#             /hub/api/zt/session-token. Notebooks exchange it for downscoped tokens with their
#             own JWT-SVID (SA jupyter-user, client jupyter), see apps/jupyterhub/zt_auth.py.
#   Mesh    → namespace jupyter is istio-injected; z2jh NetworkPolicies are off (Istio mTLS and
#             AuthorizationPolicies are the enforcement layer). KubeSpawner.services_enabled gives
#             every user pod a Service, so proxy/hub → user server traffic is mTLS (not raw pod-IP).
hub:
  # Chart hub image + py-spiffe, built and loaded into kind by `make hub-image`.
  image:
    name: zt-lab/k8s-hub-spiffe
    tag: "4.4.5"
    pullPolicy: IfNotPresent
  # SPIFFE ID spiffe://zt.lab/ns/jupyter/sa/jupyter-session = Keycloak client jupyter-session.
  # The SA comes from extras.yaml (demo 04's stand-in session-broker uses the same one).
  serviceAccount:
    create: false
    name: jupyter-session
  nodeSelector: {zt.lab/role: workloads}
  networkPolicy: {enabled: false}
  extraVolumes:
    - name: spiffe-workload-api
      csi: {driver: csi.spiffe.io, readOnly: true}
  extraVolumeMounts:
    - {name: spiffe-workload-api, mountPath: /spiffe-workload-api, readOnly: true}
  extraEnv:
    OAUTH_CLIENT_SECRET:
      valueFrom: {secretKeyRef: {name: jupyterhub-oauth, key: OAUTH_CLIENT_SECRET}}
    # auth_state encryption key, generated by scripts/gen-secrets.sh. Set explicitly because the
    # hub previously started without one and auth_state came back null.
    JUPYTERHUB_CRYPT_KEY:
      valueFrom: {secretKeyRef: {name: jupyterhub-oauth, key: JUPYTERHUB_CRYPT_KEY}}
    SPIFFE_ENDPOINT_SOCKET: unix:///spiffe-workload-api/spire-agent.sock
    ZT_KEYCLOAK_ISSUER: http://keycloak.localhost/realms/zt
    ZT_TOKEN_URL: http://keycloak.keycloak.svc:8080/realms/zt/protocol/openid-connect/token
  config:
    JupyterHub:
      authenticator_class: generic-oauth
    Authenticator:
      allow_all: true                 # any user in realm zt may sign in
      enable_auth_state: true         # keep access/refresh tokens (encrypted with JUPYTERHUB_CRYPT_KEY)
      refresh_pre_spawn: true
      auth_refresh_age: 300
    Spawner:
      # The default 30s wasn't always enough for a new JupyterLab pod (sidecar + SVID + server start)
      # on a busy kind cluster; the hub then deleted a pod that was about to come up.
      http_timeout: 120
    GenericOAuthenticator:
      client_id: jupyterhub
      oauth_callback_url: http://jupyter.localhost/hub/oauth_callback
      authorize_url: http://keycloak.localhost/realms/zt/protocol/openid-connect/auth       # browser
      token_url: http://keycloak.keycloak.svc:8080/realms/zt/protocol/openid-connect/token # in-mesh
      userdata_url: http://keycloak.keycloak.svc:8080/realms/zt/protocol/openid-connect/userinfo
      logout_redirect_url: http://keycloak.localhost/realms/zt/protocol/openid-connect/logout?client_id=jupyterhub&post_logout_redirect_uri=http%3A%2F%2Fjupyter.localhost%2Fhub%2Flogin
      # No delegation:client:spark-connect: a login token carrying may_act is refused by standard
      # (non-delegated) exchange, which is what hop 1 is.
      scope: [openid, profile, email]
      username_claim: preferred_username
      enable_pkce: true
      login_service: Keycloak (Zero Trust Lab)
  loadRoles:
    # Users (and so their servers' tokens, which are capped by the owner's permissions) may fetch
    # their own session token. Nobody but admins can read auth_state.
    user:
      scopes: ["self", "custom:zt:session-token"]
  extraConfig:
    zt-session-token: |
      # Demo 04, hop 1, inside the hub: GET /hub/api/zt/session-token returns the caller's own
      # session token (aud=jupyter, scope session:token_exchange), never the login/ID/refresh tokens.
      import asyncio, json, os, urllib.parse
      from tornado import web
      from tornado.httpclient import AsyncHTTPClient
      from jupyterhub.apihandlers.base import APIHandler
      from spiffe import WorkloadApiClient

      import base64, time
      ZT_SCOPE = "custom:zt:session-token"
      ZT_MIN_LOGIN_TTL = 240  # s; every token in the chain inherits the login token's exp
      _session_cache = {}   # user name → (login access token, response); session exp = login exp

      def _login_ttl(auth_state):
          tok = (auth_state or {}).get("access_token")
          if not tok:
              return 0
          p = tok.split(".")[1]
          p += "=" * (-len(p) % 4)
          return json.loads(base64.urlsafe_b64decode(p)).get("exp", 0) - time.time()

      async def zt_refresh_user_hook(authenticator, user, auth_state):
          # OAuthenticator only uses the refresh token once the access token is *rejected*, so the
          # hub would keep serving a login token until it expired (and session/Spark/UC tokens with
          # it). Refresh proactively when less than ZT_MIN_LOGIN_TTL is left; otherwise default.
          if not auth_state or _login_ttl(auth_state) > ZT_MIN_LOGIN_TTL:
              return None
          rt = auth_state.get("refresh_token")
          if not rt:
              return False
          try:
              info = await authenticator.get_token_info(None, authenticator.build_refresh_token_request_params(rt))
          except Exception as e:
              authenticator.log.info("zt: refresh for %s failed (%s); new login needed", user.name, e)
              return False
          if not info.get("refresh_token"):
              info["refresh_token"] = rt
          authenticator.log.info("zt: refreshed login token for %s", user.name)
          return await authenticator._token_to_auth_model(info)

      c.GenericOAuthenticator.refresh_user_hook = zt_refresh_user_hook

      def _hub_jwt_svid():
          with WorkloadApiClient(socket_path=os.environ["SPIFFE_ENDPOINT_SOCKET"]) as c:
              return c.fetch_jwt_svid(audience={os.environ["ZT_KEYCLOAK_ISSUER"]}).token

      class SessionTokenHandler(APIHandler):
          async def get(self):
              user = self.current_user
              if user is None or getattr(user, "kind", None) != "user":
                  raise web.HTTPError(403, "only users' tokens may fetch a session token")
              if ZT_SCOPE not in self.expanded_scopes:
                  raise web.HTTPError(403, f"token lacks {ZT_SCOPE}")
              # refresh_auth honours auth_refresh_age; force it when the login token is nearly expired
              near_expiry = _login_ttl(await user.get_auth_state()) < ZT_MIN_LOGIN_TTL
              user = await self.refresh_auth(user, force=near_expiry)
              login = ((await user.get_auth_state()) or {}).get("access_token")
              if not login:
                  raise web.HTTPError(409, "no login token on the hub; sign in again")
              hit = _session_cache.get(user.name)
              if hit and hit[0] == login:
                  out = hit[1]
              else:
                  body = urllib.parse.urlencode({
                      "grant_type": "urn:ietf:params:oauth:grant-type:token-exchange",
                      "client_assertion_type": "urn:ietf:params:oauth:client-assertion-type:jwt-spiffe",
                      "client_assertion": await asyncio.to_thread(_hub_jwt_svid),
                      "subject_token": login,
                      "subject_token_type": "urn:ietf:params:oauth:token-type:access_token",
                      "requested_token_type": "urn:ietf:params:oauth:token-type:access_token",
                      "scope": "session:token_exchange", "audience": "jupyter",
                  })
                  r = await AsyncHTTPClient().fetch(os.environ["ZT_TOKEN_URL"], method="POST",
                                                    body=body, raise_error=False)
                  d = json.loads(r.body or b"{}")
                  if r.code != 200 or "access_token" not in d:
                      self.log.warning("session exchange for %s failed: %s %s", user.name, r.code, d.get("error_description"))
                      raise web.HTTPError(502, f"session exchange failed: {d.get('error')} - {d.get('error_description')}")
                  out = {"session_token": d["access_token"], "expires_in": d.get("expires_in"), "scope": d.get("scope")}
                  _session_cache[user.name] = (login, out)
                  self.log.info("minted session token for %s", user.name)
              self.set_header("Content-Type", "application/json")
              self.set_header("Cache-Control", "no-store")
              self.finish(json.dumps(out))

      c.JupyterHub.custom_scopes = {ZT_SCOPE: {"description": "Fetch your own notebook session token (scope session:token_exchange)."}}
      c.JupyterHub.extra_handlers = [(r"/api/zt/session-token", SessionTokenHandler)]
    zt-server-token: |
      # The user server's own API token: the usual server scopes plus the session-token endpoint.
      # No admin:auth_state, so notebooks can't read the login, ID or refresh tokens.
      c.Spawner.server_token_scopes = [
          "users:activity!user", "access:servers!server", "read:users:name!user",
          "read:users:groups!user", "custom:zt:session-token",
      ]
    zt-spawner: |
      # Each user pod gets its own Service, and the proxy routes to its DNS name (not the pod IP),
      # so the sidecar can apply mTLS. The Service port is declared TCP: configurable-http-proxy
      # forwards the browser's Host header (jupyter.localhost), and with an "http" port Istio
      # routes by Host. No virtual host matched, so traffic fell through to PassthroughCluster as
      # plaintext and the user pod's STRICT mTLS rejected it (503, filter_chain_not_found).
      # As TCP, Istio routes by IP:port, still over mTLS.
      from kubespawner import KubeSpawner

      class ZtSpawner(KubeSpawner):
          def get_service_manifest(self, owner_reference, port):
              svc = super().get_service_manifest(owner_reference, port)
              for p in svc.spec.ports:
                  p.name = "tcp-notebook"
                  p.app_protocol = "tcp"
              return svc

      c.JupyterHub.spawner_class = ZtSpawner
      c.KubeSpawner.services_enabled = True

proxy:
  service: {type: ClusterIP}
  chp:
    nodeSelector: {zt.lab/role: workloads}
    networkPolicy: {enabled: false}

singleuser:
  image:
    # Built from apps/jupyterhub/image (minimal-notebook + pyspark-client 4.2.1 + py-spiffe):
    # pure-Python Spark Connect client, no JVM. Loaded into kind by `make jupyter-image`.
    name: zt-lab/notebook-spark-client
    tag: "4.2.1"
    pullPolicy: IfNotPresent
  defaultUrl: /lab
  serviceAccountName: jupyter-user      # SPIFFE ID spiffe://zt.lab/ns/jupyter/sa/jupyter-user = client jupyter
  nodeSelector: {zt.lab/role: workloads}
  networkPolicy: {enabled: false}
  cloudMetadata: {blockWithIptables: false}
  startTimeout: 300
  memory: {limit: 3G, guarantee: 1G}
  cpu: {limit: 2, guarantee: 0.25}
  storage:
    capacity: 2Gi
    extraVolumes:
      - name: spiffe-workload-api
        csi: {driver: csi.spiffe.io, readOnly: true}
    extraVolumeMounts:
      - {name: spiffe-workload-api, mountPath: /spiffe-workload-api, readOnly: true}
  extraEnv:
    PYTHONPATH: /opt/zt          # zt_auth helper
    SPIFFE_ENDPOINT_SOCKET: unix:///spiffe-workload-api/spire-agent.sock
    ZT_KEYCLOAK_ISSUER: http://keycloak.localhost/realms/zt
    ZT_TOKEN_URL: http://keycloak.keycloak.svc:8080/realms/zt/protocol/openid-connect/token
  extraFiles:
    zt-auth:
      mountPath: /opt/zt/zt_auth.py
      # stringData set from apps/jupyterhub/zt_auth.py by `make jupyterhub` (--set-file)

scheduling:
  userScheduler: {enabled: false}
  userPlaceholder: {enabled: false}
prePuller:
  hook: {enabled: false}
  continuous: {enabled: false}
cull:
  enabled: true
  timeout: 7200
