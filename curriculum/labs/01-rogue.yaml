# Lesson 1.5: a pod you create yourself, running as ServiceAccount spark/spark-connect.
# Nothing here is privileged: no secrets, no host access. It only names a ServiceAccount
# and mounts the SPIFFE CSI volume, which every workload in the lab does.
apiVersion: v1
kind: Pod
metadata:
  name: rogue
  namespace: spark
  labels: {app: rogue}
spec:
  serviceAccountName: spark-connect
  containers:
    - name: svid
      image: ghcr.io/spiffe/spire-agent:1.16.0
      command: ["/opt/spire/bin/spire-agent"]
      args: ["api", "watch", "-socketPath", "/spiffe-workload-api/spire-agent.sock"]
      volumeMounts: [{name: spiffe-workload-api, mountPath: /spiffe-workload-api, readOnly: true}]
    - name: curl
      image: docker.io/curlimages/curl:8.11.1
      command: ["sleep", "infinity"]
  volumes:
    - name: spiffe-workload-api
      csi: {driver: csi.spiffe.io, readOnly: true}
