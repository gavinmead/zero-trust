# PostgreSQL for Keycloak. Runs in the mesh (namespace keycloak is istio-injected),
# so Keycloak → Postgres traffic is SPIRE-backed mTLS.
apiVersion: v1
kind: ServiceAccount
metadata: {name: postgres, namespace: keycloak}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: keycloak}
spec:
  selector: {app: postgres}
  ports: [{name: tcp-postgres, port: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres, namespace: keycloak}
spec:
  serviceName: postgres
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      serviceAccountName: postgres
      nodeSelector: {zt.lab/role: platform}
      containers:
        - name: postgres
          image: docker.io/library/postgres:17.6-alpine
          env:
            - {name: POSTGRES_DB, value: keycloak}
            - {name: POSTGRES_USER, value: keycloak}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: keycloak-secrets, key: POSTGRES_PASSWORD}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "keycloak", "-d", "keycloak"]}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 2Gi}}
